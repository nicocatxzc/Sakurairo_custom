{{- /* 右下角小组件：对应 frontend/components/site/widget/toolbar.php */ -}}
{{- $p := site.Params -}}
<div class="site-widget"
    style="
--widget_button_radius:{{ default 0.6 $p.widget_button_radius }}rem;
--widget_panel_radius:{{ default 0.6 $p.widget_panel_radius }}rem;
font-family:{{ default "" $p.widget_font }};
">
    <div class="control">
        <button id="goToTop" class="widget-button" title="回到顶部">
            <i class="icon fa-icon-solid fa-caret-up fa-lg flex-center"></i>
        </button>
        <button id="widgetToggle" class="widget-button" title="小工具">
            <i class="icon fa-icon-solid fa-compass-drafting fa-lg fa-flip flex-center"></i>
        </button>
    </div>
    <div class="panel hide">
        <div class="theme-controls widget-groups">
            <div class="darkmode group">
                <button class="darkmode-toggle widget-button" aria-label="切换主题深色模式状态" title="切换主题深色模式状态"></button>
            </div>

            {{- if and $p.widget_font_switch $p.widget_font_choice }}
            <div class="font-controls group">
                {{- range $p.widget_font_choice }}
                <button type="button" class="widget-button" aria-label="切换到字体{{ .name }}" title="切换到字体{{ .name }}" data-name="{{ .name }}">{{ .name }}</button>
                {{- end }}
            </div>
            {{- end }}
        </div>
    </div>
</div>
