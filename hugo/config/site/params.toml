"cover_typedjs_config" = "{\r\n    \"strings\": [\r\n        \"安得广厦千万间，广厦一千万一间\",\r\n        \"试问岭南应不好，却道：此心安处是吾乡\",\r\n        \"三百六十行，行行干破防\",\r\n        \"明知山有虎，猛敲退堂鼓\",\r\n        \"是金子总会发光，但我是老铁。\",\r\n        \"其实惹我没有任何下场\",\r\n        \"学而不思则罔，不思不学则爽\",\r\n        \"吃得苦中苦，老板开路虎\",\r\n        \"我有超能力，但是凡事都超出我的能力\",\r\n        \"机会是留给有准备的人，没有机会别瞎准备\",\r\n        \"形而上学，不行退学。\",\r\n        \"风吹哪页读哪页，哪页不会撕哪页。\",\r\n        \"书山有路你不走，学海无涯你闯进来。\",\r\n        \"我命由我不由天，黄泉道路修真仙。\",\r\n        \"吾日三省吾身，吾帅，吾美，吾没错。\",\r\n        \"比我优秀的人都在努力，那我努力还有什么用。\",\r\n        \"失败是成功之母，但成功六亲不认。\",\r\n        \"人非草木，无需成材，能力越小，责任越小。\",\r\n        \"人生苦短，拒绝内卷。\",\r\n        \"别人笑我太疯癫，我笑别人看不穿。\",\r\n        \"天生我材必有用，我能不用就不用。\",\r\n        \"乾坤未定你我皆是黑马，闹钟一响你我都是牛马。\",\r\n        \"十窍只开了一窍，一窍不通。\",\r\n        \"但凡我有一点本事，也不会一点本事没有。\",\r\n        \"不努力一把永远不知道有多失望。\",\r\n        \"作为一个过来人，我给年轻人的建议是：不要过来。\",\r\n        \"谁说我不会乐器，我退堂鼓打的可好了。\",\r\n        \"谁说我不努力了，我只是努力的不明显而已。\",\r\n        \"是金子总会被我花光。\",\r\n        \"世上无难事，只要肯放弃。\",\r\n        \"人生不摆烂，快乐少一半。\",\r\n        \"做事一定要三思而后行。第一：能不能不做；第二：能不能明天做；第三：能不能交给别人做。\",\r\n        \"偶尔摆烂，经常偶尔。\",\r\n        \"吃得苦中苦，伺候人上人。\",\r\n        \"君子爱财取之有道，这个道叫我不知道。\",\r\n        \"一旦承认自己是废物，那么我就是无敌的。\",\r\n        \"我什么都能打住，我什么都能扛住，除了诱惑。\",\r\n        \"机会是留给有准备的人，没有机会就别瞎准备。\",\r\n        \"风雪压我俩三年，两眼一闭我长眠。\",\r\n        \"你单身，我单身，钻戒一千都嫌多。你摆烂，我摆烂，一月两千很自在。\",\r\n        \"吾日三省吾身：早饭吃什么？午饭吃什么？晚饭吃什么？\",\r\n        \"自己的失败固然可怕，但朋友的成功更令人揪心。\",\r\n        \"在哪里跌倒，就在哪里睡一觉。\",\r\n        \"男儿膝下有黄金，没钱就找男儿膝。\",\r\n        \"天无绝人之路，绝起来还真没路。\",\r\n        \"有时候不逼自己一把，我都不知道我自己有多没用。\",\r\n        \"不学习感觉自己未来要完蛋了，一学习确定自己未来要完蛋了。\"\r\n    ],\r\n    \"typeSpeed\": 140,\r\n    \"backSpeed\": 50,\r\n    \"loop\": false,\r\n    \"showCursor\": true\r\n}\r\n"
